name: CI pipeline

on:
  push:
    branches: 
      - main
  
jobs:
  test:
    runs-on: ubuntu-latest 
    
    steps:
      
      - name: checkout code
        uses: actions/checkout@v2
        
      - name: Setup Node.js
        uses: actions/setup-node@v2
        
      - name: Install Dependencies
        run: |
          npm install


      - name: Run tests
        run: |
          npm test